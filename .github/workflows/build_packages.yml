name: Build packages

on:
  workflow_dispatch:
  schedule:
    # Runs at 05:00 AM UTC, which is 9:00 PM PST (UTC-8) / 10:00 PM PDT (UTC-7)
    # This lines up with https://github.com/iree-org/iree/blob/main/.github/workflows/schedule_candidate_release.yml
    # Downstream projects using nightly releases should expect IREE and
    # iree-turbine packages to all be available around the same time. This
    # build is much faster than the IREE build though.
    - cron: '0 5 * * *'

jobs:
  build_packages:
    if: ${{ github.repository_owner == 'iree-org' || github.event_name != 'schedule' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "Setting up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r ./build_tools/requirements-packaging.txt

      - name: Build iree-turbine release candidate
        run: |
          ./build_tools/compute_local_version.py -rc --write-json
          ./build_tools/build_release.py --no-download

      - name: Upload python wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: snapshot
          path: wheelhouse

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: 'oss-exit-gate-prod'
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Clean up stale releases from staging repo
        run: |
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="iree-turbine--githubreleases" \
              --format="value(name)" 2>/dev/null)
          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="iree-turbine--githubreleases" \
                  --quiet
          '

      - name: Stage release artifacts to OSS Exit Gate and upload manifest
        env:
          TAG_NAME: "dev-wheels"
          RELEASE_TITLE: "dev-wheels"
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          VERSION="${TAG_NAME#v}"
          for f in wheelhouse/*.whl; do
            [ -e "$f" ] || continue
            gcloud artifacts generic upload \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="iree-turbine--githubreleases" \
              --package="iree-turbine" \
              --version="${VERSION}" \
              --source="$f"
          done
          cat <<EOF > manifest.json
          {
            "packages": [
              {
                "name": "iree-turbine",
                "version": "${VERSION}",
                "release_title": "${RELEASE_TITLE}"
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/iree-turbine/githubreleases/manifests/manifest-${VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"
